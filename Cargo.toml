[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# --- core (pure kernel) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-core = "0.3"
futures-util = "0.3"

# --- host / cli ---
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "process",
    "io-util",
    "io-std",
    "sync",
    "signal",
    "fs",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
regex = "1"
globset = "0.4"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "0.29"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
