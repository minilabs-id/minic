[package]
name = "minic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust terminal coding agent"
default-run = "minic"
authors = ["Particle AI"]
repository = "https://github.com/minilabs-id/minic"
homepage = "https://github.com/minilabs-id/minic"
readme = "../../README.md"
keywords = ["cli", "agent", "llm", "tui", "coding-assistant"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "minic"
path = "src/main.rs"

# Server palsu untuk test PTY. Di-gate di balik feature agar tidak ikut
# ter-build saat rilis dan tidak masuk ke installer Windows.
[[bin]]
name = "fake-mcp-server"
path = "src/bin/fake_mcp_server.rs"
required-features = ["test-servers"]

[[bin]]
name = "fake-lsp-server"
path = "src/bin/fake_lsp_server.rs"
required-features = ["test-servers"]

[lib]
name = "minic"
path = "src/lib.rs"

[dependencies]
minic-core = { path = "../core", features = ["tiktoken"] }
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
reqwest.workspace = true
futures-core.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
regex.workspace = true
globset.workspace = true
walkdir.workspace = true
rusqlite.workspace = true
ratatui.workspace = true
unicode-width.workspace = true

[dev-dependencies]
proptest = "1"
portable-pty = "0.8"

[features]
# Server palsu (MCP/LSP) untuk test. Tidak pernah aktif di build rilis, jadi
# tidak ikut masuk installer Windows.
default = []
test-servers = []
